<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fond OtherSelf « intérieur clair » (1280 × 720, plein cadre derrière le personnage).
  Mur aux tons chauds clairs, lumière douce d'une fenêtre hors champ en haut à gauche (même éclairage
  que le visage), plante, cadre et étagère reconnaissables mais flous, comme le flou d'arrière-plan
  d'une visio. Couleurs par les classes du bloc palette. Sans texte ; le bandeau est dessiné par le code.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" id="otherself-fond">
  <style id="palette">
    .mur-clair     { stop-color: #f1e7d8 }
    .mur-ombre     { stop-color: #cdbca5 }
    .lumiere-fen   { fill: #fff6e6 }
    .ombre-piece   { fill: #6b5844 }
    .bois          { fill: #a7825c }
    .bois-sombre   { fill: #7a5a3c }
    .feuille       { fill: #4f6b45 }
    .feuille-clair { fill: #6f8a5a }
    .tige          { fill: none; stroke: #5a4632; stroke-width: 5 }
    .pot           { fill: #c07a55 }
    .pot-ombre     { fill: #8f5538 }
    .cadre         { fill: #3d3630 }
    .tableau-ciel  { fill: #d9cdb5 }
    .tableau-1     { fill: #9aa58a }
    .tableau-2     { fill: #6f7d68 }
    .livre-1       { fill: #8a9aa6 }
    .livre-2       { fill: #c9b48f }
    .livre-3       { fill: #a4654e }
    .livre-4       { fill: #5d6b78 }
  </style>
  <defs>
    <linearGradient id="degrade-mur" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" class="mur-clair"/><stop offset="1" class="mur-ombre"/>
    </linearGradient>
    <filter id="flou-visio" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="flou-lumiere" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect fill="url(#degrade-mur)" x="0" y="0" width="1280" height="720"/>
  <!-- Lumière de la fenêtre (hors champ, en haut à gauche) et ombre douce de la pièce à droite. -->
  <path class="lumiere-fen" style="opacity:0.55" filter="url(#flou-lumiere)" d="M-100 -60 L620 -60 L420 520 L-100 640 Z"/>
  <path class="ombre-piece" style="opacity:0.16" filter="url(#flou-lumiere)" d="M1000 -60 L1380 -60 L1380 780 L900 780 Z"/>

  <g filter="url(#flou-visio)">
    <!-- Cadre au mur, à gauche de la tête : paysage simple. -->
    <rect class="ombre-piece" style="opacity:0.18" x="266" y="122" width="150" height="120" rx="3"/>
    <rect class="cadre" x="256" y="112" width="150" height="120" rx="3"/>
    <rect class="tableau-ciel" x="266" y="122" width="130" height="100"/>
    <path class="tableau-1" d="M266 190 C300 168 330 176 356 186 C372 192 386 180 396 176 L396 222 L266 222 Z"/>
    <path class="tableau-2" d="M266 206 C300 196 340 210 396 200 L396 222 L266 222 Z"/>

    <!-- Étagère murale à droite, avec livres et petite plante. -->
    <rect class="ombre-piece" style="opacity:0.18" x="944" y="340" width="360" height="16"/>
    <rect class="livre-1" x="968" y="234" width="22" height="96" rx="2"/>
    <rect class="livre-2" x="992" y="226" width="18" height="104" rx="2"/>
    <rect class="livre-3" x="1012" y="242" width="26" height="88" rx="2"/>
    <rect class="livre-1" x="1040" y="230" width="16" height="100" rx="2"/>
    <rect class="livre-4" x="1058" y="238" width="24" height="92" rx="2"/>
    <rect class="livre-2" x="1084" y="246" width="20" height="84" rx="2"/>
    <path class="livre-3" d="M1112 330 L1136 246 L1156 252 L1132 330 Z"/>
    <path class="pot" d="M1180 296 L1222 296 L1216 330 L1186 330 Z"/>
    <path class="feuille-clair" d="M1200 297.3 C1185.7 290.2 1178.1 275.3 1180 262.7 C1191.9 267.3 1201 281.4 1200 297.3 Z"/><path class="feuille-clair" d="M1201.5 294.2 C1200.9 277.7 1210.3 262.9 1222.5 257.8 C1224.2 270.9 1216.1 286.5 1201.5 294.2 Z"/><path class="feuille-clair" d="M1201 284 C1193.3 272 1194 257 1201 248 C1208 257 1208.7 272 1201 284 Z"/>
    <rect class="bois" x="940" y="330" width="360" height="14" rx="2"/>
    <rect class="bois-sombre" x="940" y="342" width="360" height="4"/>

    <!-- Plante en pot à gauche. -->
    <path class="tige" d="M150 600 C146 500 130 400 120 300"/><path class="tige" d="M150 600 C160 520 190 430 214 360"/><path class="tige" d="M150 600 C140 540 100 470 70 420"/>
    <path class="feuille-clair" d="M85.4 520.4 C126.6 518.7 146.4 545.1 138.1 579 C103.4 583.7 79.3 561.2 85.4 520.4 Z"/>
    <path class="feuille-clair" d="M136.1 539.5 C142.2 493.5 176.8 467.3 214.7 471.4 C213.4 509.5 182.5 540 136.1 539.5 Z"/>
    <path class="feuille" d="M64.9 434.7 C108.4 426.3 138.6 450.6 141.4 487.5 C105.9 498 72.4 478.4 64.9 434.7 Z"/>
    <path class="feuille-clair" d="M124.9 446.6 C135.7 402.6 172.2 380 208.8 387.1 C203.4 423.9 170 450.9 124.9 446.6 Z"/>
    <path class="feuille" d="M66.3 345.5 C105.6 342.1 127.4 366.7 122.9 399.7 C90.1 405.6 64.6 384.9 66.3 345.5 Z"/>
    <path class="feuille-clair" d="M121.1 364.2 C127 320.7 159.7 292.5 195.4 292.4 C194.1 328.1 164.8 359.8 121.1 364.2 Z"/>
    <path class="feuille-clair" d="M58.5 248.7 C98 255.8 119 286.7 113.5 319.3 C80.5 316.6 55.7 288.7 58.5 248.7 Z"/>
    <path class="feuille" d="M92.5 513 C135.1 512.2 163.6 539.9 165.1 575 C130.3 579 98.4 555.2 92.5 513 Z"/>
    <path class="feuille" d="M178.2 523.8 C180.2 483.9 208 460.9 241 464.2 C242.5 497.3 218.1 523.9 178.2 523.8 Z"/>
    <path class="feuille-clair" d="M113.5 419.9 C155.9 410.2 188.6 432.6 195.3 468.1 C161.1 479.5 125.6 461.7 113.5 419.9 Z"/>
    <path class="feuille-clair" d="M197.1 428.2 C201.3 381.7 235 355.4 273.3 359.8 C273.5 398.4 243.7 429 197.1 428.2 Z"/>
    <path class="feuille-clair" d="M145.7 309.5 C188.1 313.1 214.9 343.6 214.3 378.5 C179.4 378.9 149.1 351.9 145.7 309.5 Z"/>
    <path class="feuille" d="M59.7 512.3 C102.4 515.4 131 545.7 132.3 580.7 C97.4 581.5 65.4 554.8 59.7 512.3 Z"/>
    <path class="feuille" d="M116.8 537.7 C113.4 496.8 138 465.9 171.2 460.3 C177.2 493.4 156.5 527 116.8 537.7 Z"/>
    <path class="feuille-clair" d="M14.7 424.2 C59.3 416.6 92.2 441.7 97.3 478.8 C61.1 488.6 25.2 468.2 14.7 424.2 Z"/>
    <path class="feuille" d="M75.8 440.4 C73.6 399.9 99 371 132.2 367.6 C137.2 400.6 115.6 432.4 75.8 440.4 Z"/>
    <path class="pot" d="M86 590 L214 590 L200 720 L100 720 Z"/>
    <path class="pot-ombre" d="M170 590 L214 590 L200 720 L172 720 Z"/>
    <rect class="pot-ombre" x="80" y="584" width="140" height="14" rx="4"/>
  </g>
</svg>
