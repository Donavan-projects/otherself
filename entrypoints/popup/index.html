<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OtherSelf</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --surface: #f6f8fa;
        --primary: #1a56db;
        --primary-hover: #1646b8;
        --on-primary: #ffffff;
        --danger: #b42318;
        --inactive-bg: #eaeef2;
        --inactive-text: #59636e;
        --active-bg: #dcfce7;
        --active-text: #166534;
        --paused-bg: #fef3c7;
        --paused-text: #92400e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c2128;
          --text: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --surface: #262c36;
          --primary: #4c8dff;
          --primary-hover: #6aa0ff;
          --on-primary: #0d1117;
          --danger: #ff7b72;
          --inactive-bg: #2d333b;
          --inactive-text: #9198a1;
          --active-bg: #12361f;
          --active-text: #6fdd8b;
          --paused-bg: #3d2e0c;
          --paused-text: #f2cc60;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 16px; font-weight: 650; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 10px; border-radius: 999px;
        font-size: 12px; font-weight: 600;
        background: var(--inactive-bg); color: var(--inactive-text);
      }
      .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .pill[data-state="active"] { background: var(--active-bg); color: var(--active-text); }
      .pill[data-state="paused"] { background: var(--paused-bg); color: var(--paused-text); }
      #message { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
      #message[data-kind="error"] { color: var(--danger); }
      #message:empty { display: none; }
      .actions { display: grid; gap: 8px; }
      button {
        width: 100%; padding: 8px 12px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface); color: var(--text);
        font: inherit; font-weight: 550; cursor: pointer; text-align: center;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { padding: 10px 12px; border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
      button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      [hidden] { display: none !important; }
      .remove { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
      .remove button {
        width: auto; padding: 2px 0; border: 0; background: none;
        color: var(--danger); font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 2px;
      }
      details { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
      summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      details .actions { margin-top: 10px; }
      details button { padding: 6px 10px; font-size: 13px; font-weight: 500; text-align: left; }
    </style>
  </head>
  <body>
    <header>
      <h1>OtherSelf</h1>
      <span id="state" class="pill" data-state="inactive"></span>
    </header>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="activate" type="button" class="primary" hidden></button>
      <button id="pause" type="button" class="primary" hidden></button>
      <button id="preview" type="button" hidden></button>
    </div>
    <div class="remove" id="remove-section" hidden>
      <button id="deactivate" type="button"></button>
    </div>
    <details>
      <summary id="dev-tools"></summary>
      <div class="actions">
        <button id="open-rehearsal" type="button"></button>
        <button id="open-rehearsal-injected" type="button"></button>
        <button id="open-avatar" type="button"></button>
        <button id="open-voices" type="button"></button>
      </div>
    </details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
